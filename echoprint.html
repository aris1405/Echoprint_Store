<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚙️ Admin - ecoprint store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--primary:#2D6A4F;--primary-dark:#1B4332;--primary-light:#40916C;--secondary:#D4A373;--bg:#F5F0EB;--card:#fff;--text:#1E1E2F;--text-light:#5C6B73;--border:#D8CCC0;--shadow:0 8px 30px rgba(45,106,79,.15);--radius:16px;--radius-sm:10px;--transition:.3s cubic-bezier(.4,0,.2,1)}
body.dark-mode{--bg:#1a1a2e;--card:#16213e;--text:#e2e8f0;--text-light:#94a3b8;--border:#334155}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;transition:background .3s,color .3s}
.app-container{max-width:1280px;margin:0 auto;padding:0 20px;width:100%}
.navbar{background:rgba(255,255,255,.92);padding:14px 0;box-shadow:0 2px 20px rgba(0,0,0,.05);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
body.dark-mode .navbar{background:rgba(22,33,62,.92)}
.navbar .app-container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.nav-brand{font-size:24px;font-weight:900;color:var(--primary);display:flex;align-items:center;gap:6px}
.nav-brand small{font-size:11px;font-weight:400;color:var(--text-light);margin-left:4px}
.nav-menu{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav-menu .btn{padding:6px 14px;border-radius:50px;font-weight:600;font-size:13px;transition:var(--transition);background:transparent;color:var(--text-light);border:2px solid transparent;cursor:pointer}
.nav-menu .btn:hover{background:var(--bg);color:var(--text)}
.nav-menu .btn.active{background:var(--primary);color:#fff}
.btn{padding:10px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;justify-content:center;border:2px solid transparent;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,79,.3)}
.btn-outline{border-color:var(--border);background:transparent;color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#EF4444;color:#fff}
.btn-danger:hover{background:#DC2626}
.btn-success{background:#10B981;color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-block{width:100%;justify-content:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;transition:var(--transition)}
.card-title{font-size:18px;font-weight:700}
.section-title{font-size:22px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat-card.purple{border-left-color:#8B5CF6}.stat-card.green{border-left-color:#10B981}.stat-card.orange{border-left-color:#F59E0B}.stat-card.pink{border-left-color:#EC4899}.stat-card.blue{border-left-color:#3B82F6}
.stat-label{font-size:14px;color:var(--text-light);font-weight:500}
.stat-value{font-size:26px;font-weight:800;margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--bg)}
th{padding:12px 16px;text-align:left;font-weight:700;color:var(--text-light);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 16px;border-top:1px solid var(--border)}
tr:hover td{background:rgba(45,106,79,.03)}
.badge{display:inline-block;padding:4px 12px;border-radius:50px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-success{background:#D1FAE5;color:#065F46}
.badge-warning{background:#FEF3C7;color:#92400E}
.badge-danger{background:#FEE2E2;color:#991B1B}
.badge-info{background:#DBEAFE;color:#1E40AF}
.badge-secondary{background:#E5E7EB;color:#374151}
.status-badge-0{background:#FEF3C7;color:#92400E}
.status-badge-1{background:#DBEAFE;color:#1E40AF}
.status-badge-2{background:#E0E7FF;color:#3730A3}
.status-badge-3{background:#D1FAE5;color:#065F46}
.status-badge-4{background:#E5E7EB;color:#374151}
.section{padding:30px 0}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.form-group .help{font-size:12px;color:var(--text-light);margin-top:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.text-muted{color:var(--text-light)}
.text-center{text-align:center}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .icon{font-size:56px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:18px;color:var(--text);margin-bottom:4px}
.divider{border:none;border-top:2px solid var(--border);margin:16px 0}
.toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%}
.toast{padding:14px 20px;border-radius:var(--radius-sm);background:var(--card);box-shadow:0 10px 40px rgba(0,0,0,.12);border-left:4px solid var(--primary);animation:slideIn .3s ease;display:flex;align-items:center;gap:12px;font-weight:500;font-size:14px;color:var(--text)}
.toast.success{border-left-color:#10B981}.toast.error{border-left-color:#EF4444}.toast.warning{border-left-color:#F59E0B}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast .toast-close{margin-left:auto;font-size:18px;cursor:pointer;opacity:.5}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal{background:var(--card);border-radius:var(--radius);padding:32px;max-width:600px;width:92%;max-height:90vh;overflow-y:auto;animation:scaleIn .25s ease;color:var(--text)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h2{font-size:22px}
.modal-close{font-size:28px;cursor:pointer;opacity:.5;line-height:1}
.modal-close:hover{opacity:1;transform:rotate(90deg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.info-banner{background:var(--primary-light);color:#fff;text-align:center;padding:10px;border-radius:var(--radius-sm);margin-bottom:16px;font-weight:600}
.info-banner code{background:rgba(0,0,0,.2);color:#fff;padding:1px 8px;border-radius:4px}
.photo-upload-zone{border:3px dashed var(--primary-light);border-radius:var(--radius-sm);padding:20px;text-align:center;background:rgba(45,106,79,.04);cursor:pointer;transition:var(--transition)}
.photo-upload-zone:hover{background:rgba(45,106,79,.10);border-color:var(--primary)}
.photo-upload-zone .upload-icon{font-size:42px;margin-bottom:8px}
.photo-upload-zone .upload-label{font-weight:700;color:var(--primary);margin-bottom:4px}
.photo-upload-zone .upload-hint{font-size:12px;color:var(--text-light)}
.storage-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.storage-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .4s}
.storage-bar-fill.warn{background:linear-gradient(90deg,#F59E0B,#EF4444)}
@media (max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}.navbar .app-container{flex-direction:column;align-items:stretch}.nav-menu{justify-content:center}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<nav class="navbar">
    <div class="app-container">
        <div class="nav-brand"><span>🌿</span> ecoprint<span style="color:var(--secondary)">store</span> <small>· Admin Panel</small></div>
        <div class="nav-menu" id="navMenu"></div>
    </div>
</nav>

<main class="app-container section" id="appContent"></main>
<div id="modalContainer"></div>

<script>
/* =====================================================================
   admin.html — Panel Admin (berbagi localStorage dengan ecoprint.html)
   ===================================================================== */
const APP_VERSION = '3.0-split';
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CATEGORIES = ['Kain/Bahan Ecoprint','Dress','Gamis','Gaun','Kaos','Kemeja','Kimono','Rompi','Totebag'];
const STATUS_PESANAN = ['Menunggu Pembayaran','Diproses','Dikirim','Selesai','Dibatalkan'];

const DB = {
    get(k, d) { try { const v = localStorage.getItem('ecoprint_' + k); return v ? JSON.parse(v) : (d !== undefined ? d : null); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ecoprint_' + k, JSON.stringify(v)); return true; } catch (e) { console.error(e); return false; } },
    push(k, i) { const a = this.get(k, []); a.push(i); this.set(k, a); return a; },
    find(k, p) { return this.get(k, []).find(p); },
    filter(k, p) { return this.get(k, []).filter(p); },
    update(k, p, u) { const a = this.get(k, []); const i = a.findIndex(p); if (i !== -1) { a[i] = { ...a[i], ...u }; this.set(k, a); return a[i]; } return null; },
    remove(k, p) { const a = this.get(k, []); const f = a.filter(x => !p(x)); this.set(k, f); return f; }
};

const PhotoStorage = {
    getAll() { return DB.get('photos', {}); },
    get(id) { return this.getAll()[id] || null; },
    set(id, url) { const a = this.getAll(); a[id] = url; return DB.set('photos', a); },
    remove(id) { const a = this.getAll(); delete a[id]; DB.set('photos', a); },
    has(id) { return !!this.get(id); },
    count() { return Object.keys(this.getAll()).length; },
    sizeKB() { const a = this.getAll(); let t = 0; Object.values(a).forEach(v => t += v.length); return Math.round(t / 1024); },
    clear() { DB.set('photos', {}); }
};

const Helpers = {
    date() { return new Date().toISOString(); },
    formatDate(d) { try { return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); } catch { return d; } },
    formatDateTime(d) { try { return new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch { return d; } },
    formatRupiah(n) { return 'Rp ' + Number(n||0).toLocaleString('id-ID'); },
    stockStatus(s) { if (s <= 0) return { label: 'Habis', class: 'badge-danger' }; if (s <= 5) return { label: 'Stok Menipis', class: 'badge-warning' }; return { label: 'Tersedia', class: 'badge-success' }; },
    slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
    productIllustration(name, category) {
        const nama = String(name || 'Produk'); const kat = String(category || 'Ecoprint');
        const nm = nama.length > 26 ? nama.slice(0, 25) + '…' : nama;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#2D6A4F"/><text x="100" y="105" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">${escapeHtml(nm)}</text></svg>`;
        return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    },
    fileToDataUrl(file, maxDim = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            if (!file || !file.type || !/^image\//.test(file.type)) { reject(new Error('Bukan file gambar')); return; }
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const c = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) { const r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
                        c.width = w; c.height = h;
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', quality));
                    } catch (err) { reject(err); }
                };
                img.onerror = () => reject(new Error('Gagal baca gambar'));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error('Gagal baca file'));
            reader.readAsDataURL(file);
        });
    },
    imgFallback(el) {
        if (el.getAttribute('data-fallback-done') === 'true') return;
        const name = el.getAttribute('data-name') || 'Produk';
        const cat = el.getAttribute('data-cat') || 'Ecoprint';
        el.setAttribute('data-fallback-done', 'true');
        el.onerror = null;
        el.src = Helpers.productIllustration(name, cat);
    }
};

const Stock = {
    record(pid, jenis, jml, before, after, ket) {
        const p = DB.find('products', x => x.id === pid);
        DB.push('stockMovements', { id: 'SM-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), tanggal: Helpers.date(), productId: pid, productNama: p ? p.nama : '-', jenis, jumlah: Number(jml), stokSebelum: Number(before), stokSesudah: Number(after), keterangan: ket || '' });
    },
    addStock(pid, jml, ket) { const p = DB.find('products', x => x.id === pid); if (!p) return false; const before = p.stok, after = before + jml; if (after < 0) return false; DB.update('products', x => x.id === pid, { stok: after }); this.record(pid, 'Stock Masuk', jml, before, after, ket); return true; },
    restoreStock(pid, jml, ket) { const p = DB.find('products', x => x.id === pid); if (!p) return false; const before = p.stok, after = before + jml; DB.update('products', x => x.id === pid, { stok: after }); this.record(pid, 'Retur', jml, before, after, ket); return true; },
    all() { return DB.get('stockMovements', []).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)); },
    history(pid) { return DB.filter('stockMovements', m => m.productId === pid).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)); },
    summary(pid) {
        const p = DB.find('products', x => x.id === pid); if (!p) return null;
        const moves = this.history(pid); let masuk = 0, terjual = 0;
        moves.forEach(m => { if (m.jenis === 'Stock Masuk' || m.jenis === 'Retur') masuk += m.jumlah; else if (m.jenis === 'Terjual') terjual += m.jumlah; });
        const awal = p.stokAwal !== undefined ? p.stokAwal : p.stok;
        return { stokAwal: awal, stokMasuk: masuk, terjual, stokAkhir: awal + masuk - terjual, stokSekarang: p.stok };
    }
};

const Toast = {
    show(m, t = 'info') { const c = document.getElementById('toastContainer'); const el = document.createElement('div'); el.className = `toast ${t}`; const i = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' }; el.innerHTML = `<span>${i[t]||'ℹ️'}</span><span>${m}</span><span class="toast-close" onclick="this.parentElement.remove()">✕</span>`; c.appendChild(el); setTimeout(() => el.remove(), 4000); },
    success(m) { this.show(m,'success'); }, error(m) { this.show(m,'error'); }, warning(m) { this.show(m,'warning'); }, info(m) { this.show(m,'info'); }
};

const Modal = {
    open(html) { document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)Modal.close()"><div class="modal">${html}</div></div>`; },
    close() { document.getElementById('modalContainer').innerHTML = ''; }
};

const State = {
    currentPage: 'dashboard', currentAdmin: null, _settingsCache: null,

    init() {
        const sess = DB.get('admin_session', null);
        if (!sess || !sess.username) { window.location.href = 'login.html'; return; }
        const adm = DB.get('admin', null);
        if (!adm || adm.username !== sess.username) { window.location.href = 'login.html'; return; }
        this.currentAdmin = adm;
        this.applySettings();
        this.updateNav();
        this.renderPage('dashboard');
    },

    getSettings() {
        if (this._settingsCache) return this._settingsCache;
        const s = DB.get('settings', { primary: '#2D6A4F', secondary: '#D4A373', darkMode: false, promoText: '🎉 Diskon 20%', promoButton: 'Belanja', notification: 'Gratis ongkir', fotoFolder: 'src/produk/' });
        this._settingsCache = s; return s;
    },
    applySettings() {
        const s = this.getSettings();
        document.documentElement.style.setProperty('--primary', s.primary);
        document.documentElement.style.setProperty('--secondary', s.secondary);
        document.body.classList.toggle('dark-mode', !!s.darkMode);
    },
    saveSettings(ns) { this._settingsCache = { ...this.getSettings(), ...ns }; DB.set('settings', this._settingsCache); this.applySettings(); },

    updateNav() {
        const menu = document.getElementById('navMenu');
        const items = [
            ['dashboard','📊 Dashboard'],
            ['products','📦 Produk'],
            ['stock','📥 Stok'],
            ['orders','📋 Pesanan'],
            ['sales','💰 Rekap'],
            ['top','🏆 Terlaris'],
            ['settings','⚙️ Pengaturan']
        ];
        menu.innerHTML = items.map(([k, l]) => `<button class="btn ${this.currentPage===k?'active':''}" onclick="State.renderPage('${k}')">${l}</button>`).join('') +
            `<a href="ecoprint.html" class="btn" style="text-decoration:none;">🏪 Toko</a>` +
            `<button class="btn btn-danger" onclick="State.logout()">🚪 Logout</button>`;
    },

    logout() {
        if (!confirm('Yakin logout?')) return;
        DB.set('admin_session', null);
        window.location.href = 'login.html';
    },

    renderPage(page) {
        this.currentPage = page;
        const r = { dashboard:()=>R.dashboard(), products:()=>R.products(), stock:()=>R.stock(), orders:()=>R.orders(), sales:()=>R.sales(), top:()=>R.top(), settings:()=>R.settings() };
        document.getElementById('appContent').innerHTML = (r[page] || r.dashboard)();
        this.updateNav();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    // ── Product CRUD ──
    showAdd() { R.modalProduct(); },
    showEdit(id) { R.modalProduct(id); },
    saveProduct(e) {
        e.preventDefault();
        const id = document.getElementById('pId').value.trim().toUpperCase();
        if (DB.find('products', x => x.id === id)) { Toast.error('ID sudah ada'); return false; }
        const stok = Number(document.getElementById('pStok').value);
        DB.push('products', { id, nama: document.getElementById('pNama').value.trim(), kategori: document.getElementById('pKategori').value, harga: Number(document.getElementById('pHarga').value), stok, stokAwal: stok, foto: document.getElementById('pFoto').value.trim(), deskripsi: document.getElementById('pDesk').value.trim(), aktif: true, created_at: Helpers.date() });
        Toast.success('✅ Produk ditambahkan');
        Modal.close(); this.renderPage('products');
        return false;
    },
    updateProduct(e, id) {
        e.preventDefault();
        const old = DB.find('products', x => x.id === id);
        const stok = Number(document.getElementById('pStok').value);
        if (old && stok !== old.stok) {
            const diff = stok - old.stok;
            if (diff > 0) Stock.record(id, 'Stock Masuk', diff, old.stok, stok, 'Koreksi edit');
            else Stock.record(id, 'Terjual', Math.abs(diff), old.stok, stok, 'Koreksi edit');
        }
        DB.update('products', x => x.id === id, { nama: document.getElementById('pNama').value.trim(), kategori: document.getElementById('pKategori').value, harga: Number(document.getElementById('pHarga').value), stok, foto: document.getElementById('pFoto').value.trim(), deskripsi: document.getElementById('pDesk').value.trim() });
        Toast.success('✅ Produk diperbarui');
        Modal.close(); this.renderPage('products');
        return false;
    },
    deleteProduct(id) { if (!confirm('Hapus produk?')) return; DB.remove('products', x => x.id === id); PhotoStorage.remove(id); Toast.info('Produk dihapus'); this.renderPage('products'); },
    toggleProduct(id) { const p = DB.find('products', x => x.id === id); if (p) { DB.update('products', x => x.id === id, { aktif: p.aktif === false ? true : false }); Toast.info('Status diubah'); this.renderPage('products'); } },

    // ── Stock ──
    addStock() {
        const pid = document.getElementById('stkProd').value;
        const qty = Number(document.getElementById('stkQty').value);
        const note = document.getElementById('stkNote').value.trim() || 'Stok masuk';
        if (!pid || !qty || qty < 1) { Toast.error('Lengkapi data'); return; }
        if (Stock.addStock(pid, qty, note)) { Toast.success(`✅ +${qty} stok`); this.renderPage('stock'); }
    },

    // ── Orders ──
    changeStatus(trxId, st) {
        const t = DB.find('transactions', x => x.id === trxId); if (!t) return;
        if (st === 'Dibatalkan' && t.stockProcessed) {
            for (const it of t.items) Stock.restoreStock(it.productId, it.qty, `Batal ${trxId}`);
            DB.update('transactions', x => x.id === trxId, { status: st, stockProcessed: false });
            Toast.success('Stok dikembalikan');
        } else {
            DB.update('transactions', x => x.id === trxId, { status: st });
            Toast.success(`Status → ${st}`);
        }
        this.renderPage('orders');
    },

    // ── Settings ──
    saveSettingsForm(e) {
        e.preventDefault();
        this.saveSettings({ primary: document.getElementById('setPrimary').value, secondary: document.getElementById('setSecondary').value, promoText: document.getElementById('setPromoText').value, promoButton: document.getElementById('setPromoButton').value, notification: document.getElementById('setNotification').value, fotoFolder: document.getElementById('setFolder').value.trim() || 'src/produk/', darkMode: document.getElementById('setDark').checked });
        Toast.success('✅ Disimpan');
        this.renderPage('settings');
        return false;
    },
    saveAdmin(e) {
        e.preventDefault();
        const nama = document.getElementById('admNama').value.trim();
        const user = document.getElementById('admUser').value.trim();
        const pass = document.getElementById('admPass').value;
        if (!nama || !user) { Toast.error('Lengkapi'); return false; }
        const upd = { ...this.currentAdmin, nama, username: user };
        if (pass) upd.password = pass;
        DB.set('admin', upd); DB.set('admin_session', { username: user }); this.currentAdmin = upd;
        Toast.success('✅ Akun diperbarui');
        return false;
    },

    // ── Upload Foto ──
    async uploadOne(id, file) {
        try {
            Toast.info('Memproses...');
            const url = await Helpers.fileToDataUrl(file);
            PhotoStorage.set(id, url) ? Toast.success('✅ Foto disimpan') : Toast.error('Storage penuh');
            this.renderPage('products');
        } catch (e) { Toast.error(e.message); }
    },
    async uploadMany(files) {
        const list = Array.from(files || []).filter(f => f.type && /^image\//.test(f.type));
        if (!list.length) { Toast.error('Tidak ada gambar'); return; }
        const products = DB.get('products', []);
        Toast.info(`⏳ Proses ${list.length} foto...`);
        let ok = 0, fail = 0, skip = [];
        for (const f of list) {
            const stem = (f.name || '').replace(/\.[^.]+$/, '').toLowerCase();
            const match = products.find(p => p.id.toLowerCase() === stem || Helpers.slugify(p.nama) === Helpers.slugify(stem) || (p.foto && p.foto.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase() === stem));
            if (!match) { skip.push(f.name); continue; }
            try { const url = await Helpers.fileToDataUrl(f); PhotoStorage.set(match.id, url) ? ok++ : fail++; }
            catch { fail++; }
        }
        if (ok) Toast.success(`✅ ${ok} berhasil`);
        if (fail) Toast.warning(`${fail} gagal`);
        if (skip.length) Toast.warning(`${skip.length} tidak cocok: ${skip.slice(0,3).join(', ')}`);
        this.renderPage('settings');
    },
    clearPhotos() { if (!confirm('Hapus semua foto lokal?')) return; PhotoStorage.clear(); Toast.info('Dihapus'); this.renderPage('settings'); },
    removePhoto(id) { if (!confirm('Hapus foto produk ini?')) return; PhotoStorage.remove(id); Toast.info('Dihapus'); this.renderPage('products'); }
};

// ============= RENDER =============
const R = {
    _img(p) {
        if (!p) return Helpers.productIllustration('Produk', '');
        const lp = PhotoStorage.get(p.id);
        if (lp) return lp;
        const raw = (p.foto && String(p.foto).trim()) ? String(p.foto).trim() : '';
        if (!raw) return Helpers.productIllustration(p.nama, p.kategori);
        if (/^(https?:|data:|blob:|\/\/|\/|src\/)/i.test(raw)) return encodeURI(raw);
        const f = (State.getSettings().fotoFolder || 'src/produk/').trim();
        return encodeURI(f + (f.endsWith('/') ? '' : '/') + raw.replace(/^\.?\//, ''));
    },

    dashboard() {
        const products = DB.get('products', []);
        const trx = DB.get('transactions', []);
        const totalStok = products.reduce((s,p) => s + p.stok, 0);
        const pendapatan = trx.filter(t => t.status !== 'Dibatalkan').reduce((s,t) => s + t.total, 0);
        const terjual = trx.filter(t => t.status !== 'Dibatalkan').reduce((s,t) => s + t.items.reduce((ss,i) => ss+i.qty, 0), 0);
        return `<div>
            <div class="flex-between mb-16"><h2 class="section-title" style="margin:0;">📊 Dashboard</h2><span class="text-muted">👋 ${escapeHtml(State.currentAdmin.nama)}</span></div>
            <div class="grid-4" style="margin-bottom:20px;">
                <div class="stat-card purple"><div class="stat-label">📦 Produk</div><div class="stat-value">${products.length}</div></div>
                <div class="stat-card green"><div class="stat-label">📊 Total Stok</div><div class="stat-value">${totalStok}</div></div>
                <div class="stat-card blue"><div class="stat-label">🧾 Transaksi</div><div class="stat-value">${trx.length}</div></div>
                <div class="stat-card orange"><div class="stat-label">🛒 Terjual</div><div class="stat-value">${terjual}</div></div>
            </div>
            <div class="grid-4" style="margin-bottom:20px;">
                <div class="stat-card pink" style="grid-column:span 2;"><div class="stat-label">💰 Pendapatan</div><div class="stat-value" style="font-size:20px;">${Helpers.formatRupiah(pendapatan)}</div></div>
                <div class="stat-card purple"><div class="stat-label">⏳ Menunggu</div><div class="stat-value">${trx.filter(t => t.status === 'Menunggu Pembayaran').length}</div></div>
                <div class="stat-card green"><div class="stat-label">✅ Selesai</div><div class="stat-value">${trx.filter(t => t.status === 'Selesai').length}</div></div>
            </div>
            <div class="card"><h3 class="card-title mb-16">📋 Pesanan Terbaru</h3>
                ${trx.length === 0 ? '<div class="text-muted">Belum ada pesanan.</div>' : `<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Nama</th><th>Total</th><th>Status</th></tr></thead><tbody>${trx.slice(-5).reverse().map(t => `<tr><td><strong>${t.id}</strong></td><td>${escapeHtml(t.customer.nama)}</td><td>${Helpers.formatRupiah(t.total)}</td><td><span class="badge status-badge-${STATUS_PESANAN.indexOf(t.status)}">${t.status}</span></td></tr>`).join('')}</tbody></table></div>`}
            </div>
        </div>`;
    },

    products() {
        const products = DB.get('products', []);
        return `<div>
            <div class="flex-between mb-16"><h2 class="section-title" style="margin:0;">📦 Kelola Produk</h2><button class="btn btn-primary" onclick="State.showAdd()">+ Tambah Produk</button></div>
            ${products.length === 0 ? `<div class="empty-state"><div class="icon">📦</div><h3>Belum ada produk</h3></div>` : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Foto</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
            ${products.map(p => `<tr>
                <td><img src="${R._img(p)}" data-name="${escapeHtml(p.nama)}" data-cat="${escapeHtml(p.kategori)}" onerror="Helpers.imgFallback(this)" style="width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--bg);" /></td>
                <td><strong>${escapeHtml(p.nama)}</strong><div class="text-muted" style="font-size:11px;">${p.id}</div></td>
                <td>${escapeHtml(p.kategori)}</td>
                <td>${Helpers.formatRupiah(p.harga)}</td>
                <td>${p.stok}</td>
                <td>${p.aktif !== false ? '<span class="badge badge-success">Aktif</span>' : '<span class="badge badge-secondary">Nonaktif</span>'}</td>
                <td style="display:flex;gap:4px;flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" onclick="State.showEdit('${p.id}')">✏️</button>
                    <button class="btn btn-sm ${p.aktif !== false ? 'btn-outline' : 'btn-success'}" onclick="State.toggleProduct('${p.id}')">${p.aktif !== false ? 'Off' : 'On'}</button>
                    <button class="btn btn-danger btn-sm" onclick="State.deleteProduct('${p.id}')">🗑️</button>
                </td>
            </tr>`).join('')}</tbody></table></div></div>`}
        </div>`;
    },

    modalProduct(id) {
        const p = id ? DB.find('products', x => x.id === id) : null;
        const isEdit = !!p;
        Modal.open(`
            <div class="modal-header"><h2>${isEdit ? '✏️ Edit' : '➕ Tambah'} Produk</h2><span class="modal-close" onclick="Modal.close()">×</span></div>
            <form onsubmit="return ${isEdit ? `State.updateProduct(event,'${id}')` : 'State.saveProduct(event)'}">
                ${!isEdit ? `<div class="form-group"><label>ID Produk</label><input type="text" id="pId" placeholder="PRD025" required /></div>` : ''}
                <div class="form-group"><label>Nama</label><input type="text" id="pNama" value="${p ? escapeHtml(p.nama) : ''}" required /></div>
                <div class="form-group"><label>Kategori</label><select id="pKategori">${CATEGORIES.map(c => `<option ${p && c === p.kategori ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select></div>
                <div class="form-row">
                    <div class="form-group"><label>Harga</label><input type="number" id="pHarga" value="${p ? p.harga : ''}" min="0" required /></div>
                    <div class="form-group"><label>Stok</label><input type="number" id="pStok" value="${p ? p.stok : ''}" min="0" required /></div>
                </div>
                <div class="form-group"><label>Nama File Foto (opsional)</label><input type="text" id="pFoto" value="${p ? escapeHtml(p.foto || '') : ''}" placeholder="banner ecoPrint1.jpeg" /><div class="help">Jika kosong, ilustrasi otomatis digunakan. Bisa juga upload dari Pengaturan.</div></div>
                <div class="form-group"><label>Deskripsi</label><textarea id="pDesk" rows="3" required>${p ? escapeHtml(p.deskripsi || '') : ''}</textarea></div>
                <button type="submit" class="btn btn-primary btn-block">${isEdit ? 'Update' : 'Simpan'}</button>
            </form>
        `);
    },

    stock() {
        const products = DB.get('products', []);
        return `<div>
            <h2 class="section-title">📥 Manajemen Stok</h2>
            <div class="grid-2">
                <div class="card"><h3 class="card-title mb-16">➕ Tambah Stok</h3>
                    <div class="form-group"><label>Produk</label><select id="stkProd"><option value="">Pilih...</option>${products.map(p => `<option value="${p.id}">${escapeHtml(p.nama)} (${p.stok})</option>`).join('')}</select></div>
                    <div class="form-group"><label>Jumlah</label><input type="number" id="stkQty" min="1" value="1" /></div>
                    <div class="form-group"><label>Keterangan</label><input type="text" id="stkNote" placeholder="Produksi baru" /></div>
                    <button class="btn btn-primary btn-block" onclick="State.addStock()">📥 Tambah Stok</button>
                </div>
                <div class="card"><h3 class="card-title mb-16">📊 Ringkasan</h3>
                    <div class="table-wrap" style="max-height:400px;overflow-y:auto;"><table><thead><tr><th>Produk</th><th>Stok</th><th>Status</th></tr></thead><tbody>${products.map(p => { const b = Helpers.stockStatus(p.stok); return `<tr><td>${escapeHtml(p.nama)}</td><td>${p.stok}</td><td><span class="badge ${b.class}">${b.label}</span></td></tr>`; }).join('')}</tbody></table></div>
                </div>
            </div>
            <div class="card mt-16"><h3 class="card-title mb-16">📋 Riwayat (10 terbaru)</h3>
                ${(() => { const h = Stock.all().slice(0, 10); if (!h.length) return '<div class="text-muted">Belum ada riwayat</div>'; return `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Produk</th><th>Jenis</th><th>Qty</th><th>Sebelum</th><th>Sesudah</th><th>Ket</th></tr></thead><tbody>${h.map(m => `<tr><td>${Helpers.formatDate(m.tanggal)}</td><td>${escapeHtml(m.productNama)}</td><td><span class="badge badge-info">${m.jenis}</span></td><td>${m.jenis === 'Terjual' ? '-' : '+'}${m.jumlah}</td><td>${m.stokSebelum}</td><td>${m.stokSesudah}</td><td>${escapeHtml(m.keterangan) || '-'}</td></tr>`).join('')}</tbody></table></div>`; })()}
            </div>
        </div>`;
    },

    orders() {
        const trx = DB.get('transactions', []).slice().reverse();
        return `<div>
            <h2 class="section-title">📋 Kelola Pesanan</h2>
            ${trx.length === 0 ? '<div class="empty-state"><div class="icon">📋</div><h3>Belum ada pesanan</h3></div>' : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Tanggal</th><th>Nama</th><th>WA</th><th>Total</th><th>Status</th><th>Ubah</th></tr></thead><tbody>
            ${trx.map(t => `<tr><td><strong>${t.id}</strong></td><td>${t.tanggal}</td><td>${escapeHtml(t.customer.nama)}</td><td>${escapeHtml(t.customer.whatsapp)}</td><td>${Helpers.formatRupiah(t.total)}</td><td><span class="badge status-badge-${STATUS_PESANAN.indexOf(t.status)}">${t.status}</span></td><td><select onchange="State.changeStatus('${t.id}', this.value)" style="padding:4px 8px;font-size:12px;border-radius:8px;border:1px solid var(--border);">${STATUS_PESANAN.map(s => `<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
        </div>`;
    },

    sales() {
        const trx = DB.get('transactions', []).slice().reverse();
        const valid = trx.filter(t => t.status !== 'Dibatalkan');
        const pendapatan = valid.reduce((s,t) => s + t.total, 0);
        return `<div>
            <h2 class="section-title">💰 Rekap Penjualan</h2>
            <div class="grid-3" style="margin-bottom:20px;">
                <div class="stat-card purple"><div class="stat-label">Transaksi</div><div class="stat-value">${trx.length}</div></div>
                <div class="stat-card green"><div class="stat-label">Barang Terjual</div><div class="stat-value">${valid.reduce((s,t) => s + t.items.reduce((ss,i) => ss+i.qty, 0), 0)}</div></div>
                <div class="stat-card pink"><div class="stat-label">Pendapatan</div><div class="stat-value" style="font-size:18px;">${Helpers.formatRupiah(pendapatan)}</div></div>
            </div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Tanggal</th><th>Nama</th><th>Produk</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead><tbody>
            ${trx.length === 0 ? '<tr><td colspan="7" class="text-center text-muted">Belum ada data</td></tr>' : trx.map(t => t.items.map((it, idx) => `<tr>${idx===0?`<td rowspan="${t.items.length}"><strong>${t.id}</strong></td><td rowspan="${t.items.length}">${t.tanggal}</td><td rowspan="${t.items.length}">${escapeHtml(t.customer.nama)}</td>`:''}<td>${escapeHtml(it.nama)}</td><td>${it.qty}</td>${idx===0?`<td rowspan="${t.items.length}"><strong>${Helpers.formatRupiah(t.total)}</strong></td><td rowspan="${t.items.length}"><span class="badge status-badge-${STATUS_PESANAN.indexOf(t.status)}">${t.status}</span></td>`:''}</tr>`).join('')).join('')}
            </tbody></table></div></div>
        </div>`;
    },

    top() {
        const trx = DB.get('transactions', []).filter(t => t.status !== 'Dibatalkan');
        const s = {};
        trx.forEach(t => t.items.forEach(it => { if (!s[it.productId]) s[it.productId] = { nama: it.nama, kategori: it.kategori, qty: 0, pendapatan: 0, harga: it.harga }; s[it.productId].qty += it.qty; s[it.productId].pendapatan += it.subtotal; }));
        const sorted = Object.values(s).sort((a,b) => b.qty - a.qty);
        return `<div>
            <h2 class="section-title">🏆 Produk Terlaris</h2>
            ${!sorted.length ? '<div class="empty-state"><div class="icon">🏆</div><h3>Belum ada penjualan</h3></div>' : `<div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Produk</th><th>Kategori</th><th>Terjual</th><th>Pendapatan</th></tr></thead><tbody>${sorted.map((x,i) => `<tr><td><strong>#${i+1}</strong></td><td>${escapeHtml(x.nama)}</td><td>${escapeHtml(x.kategori)}</td><td>${x.qty} pcs</td><td>${Helpers.formatRupiah(x.pendapatan)}</td></tr>`).join('')}</tbody></table></div></div>`}
        </div>`;
    },

    settings() {
        const s = State.getSettings();
        const cnt = PhotoStorage.count(), kb = PhotoStorage.sizeKB(), pct = Math.min(100, Math.round(kb/5000*100));
        return `<div style="max-width:800px;margin:0 auto;">
            <h2 class="section-title">⚙️ Pengaturan</h2>
            <div class="card mb-16">
                <form onsubmit="return State.saveSettingsForm(event)">
                    <div class="form-row">
                        <div class="form-group"><label>Warna Utama</label><input type="color" id="setPrimary" value="${s.primary}" /></div>
                        <div class="form-group"><label>Warna Sekunder</label><input type="color" id="setSecondary" value="${s.secondary}" /></div>
                    </div>
                    <div class="form-group"><label>Teks Promo Banner</label><input type="text" id="setPromoText" value="${escapeHtml(s.promoText)}" /></div>
                    <div class="form-group"><label>Tombol Promo</label><input type="text" id="setPromoButton" value="${escapeHtml(s.promoButton)}" /></div>
                    <div class="form-group"><label>Notifikasi Atas</label><input type="text" id="setNotification" value="${escapeHtml(s.notification)}" /></div>
                    <div class="form-group"><label>📁 Folder Foto (URL)</label><input type="text" id="setFolder" value="${escapeHtml(s.fotoFolder || 'src/produk/')}" /><div class="help">Untuk foto alternatif jika tidak ada upload lokal.</div></div>
                    <div class="form-group"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="setDark" ${s.darkMode ? 'checked' : ''} style="width:auto;" /> Mode Gelap</label></div>
                    <button type="submit" class="btn btn-primary btn-block">💾 Simpan</button>
                </form>
            </div>

            <div class="card mb-16">
                <h3 class="card-title mb-8">📷 Upload Foto Produk</h3>
                <p class="help mb-16">Pilih foto dari komputer. Nama file otomatis dicocokkan ke produk.</p>
                <input type="file" id="filesIn" multiple accept="image/*" style="display:none" onchange="State.uploadMany(this.files); this.value='';" />
                <input type="file" id="folderIn" webkitdirectory directory multiple accept="image/*" style="display:none" onchange="State.uploadMany(this.files); this.value='';" />
                <div class="photo-upload-zone" onclick="document.getElementById('filesIn').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-label">Klik untuk pilih file</div>
                    <div class="upload-hint">Bisa pilih banyak file sekaligus</div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
                    <button class="btn btn-outline" onclick="document.getElementById('folderIn').click()">📂 Pilih Folder</button>
                    <button class="btn btn-danger" onclick="State.clearPhotos()">🗑️ Hapus Semua Foto</button>
                </div>
                <div style="background:var(--bg);border-radius:10px;padding:14px;margin-top:16px;">
                    <div class="flex-between"><strong>💾 Storage Foto</strong><span>${cnt} foto · ${kb} KB</span></div>
                    <div class="storage-bar"><div class="${pct>70?'storage-bar-fill warn':'storage-bar-fill'}" style="width:${pct}%"></div></div>
                    <div class="help mt-8">Maks ~5 MB. Terpakai ${pct}%.</div>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title mb-8">👤 Akun Admin</h3>
                <form onsubmit="return State.saveAdmin(event)">
                    <div class="form-group"><label>Nama</label><input type="text" id="admNama" value="${escapeHtml(State.currentAdmin.nama)}" required /></div>
                    <div class="form-group"><label>Username</label><input type="text" id="admUser" value="${escapeHtml(State.currentAdmin.username)}" required /></div>
                    <div class="form-group"><label>Password Baru (kosongkan jika tidak diubah)</label><input type="password" id="admPass" placeholder="••••••" autocomplete="new-password" /></div>
                    <button type="submit" class="btn btn-primary btn-block">💾 Simpan Akun</button>
                </form>
            </div>
        </div>`;
    }
};

window.State = State;
window.Helpers = Helpers;
window.DB = DB;
window.Stock = Stock;
window.PhotoStorage = PhotoStorage;
window.Toast = Toast;
window.Modal = Modal;
window.R = R;

State.init();
console.log('🌿 admin.html v3.0 loaded');
</script>
</body>
</html>
